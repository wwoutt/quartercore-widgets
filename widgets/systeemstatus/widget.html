<style>
    .status { display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 6px; padding: 12px 16px; }
    .title { color: var(--olh-muted); font-size: 15px; text-transform: uppercase; letter-spacing: .08em; }
    .big { font-family: Teko, sans-serif; font-size: 40px; line-height: 1; }
    .label { color: var(--olh-muted); font-size: 13px; }
    .update { padding: 6px 10px; border-radius: 8px; font-size: 15px; background: rgba(255, 255, 255, .06); }
    .update.pending { background: rgba(255, 193, 7, .18); color: #ffc107; }
</style>
<div class="status">
    <div class="title" id="host">Systeem</div>
    <div><div class="big" id="uptime">--</div><div class="label">uptime</div></div>
    <div><div class="big" id="load">--</div><div class="label">belasting (1 min)</div></div>
    <div class="update" id="update">Updates: --</div>
</div>
<script>
    function formatUptime(seconds) {
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor(seconds % 86400 / 3600);
        const minutes = Math.floor(seconds % 3600 / 60);
        return (days ? days + 'd ' : '') + hours + 'u ' + minutes + 'm';
    }

    function onData(data, info) {
        if (!info.ok || !data) {
            document.getElementById('update').textContent = info.error || 'Geen gegevens';
            return;
        }
        document.getElementById('host').textContent = data.hostname;
        document.getElementById('uptime').textContent = formatUptime(data.uptime);
        document.getElementById('load').textContent = data.load[0] + ' / ' + data.cpus + ' cores';
        const update = document.getElementById('update');
        update.classList.toggle('pending', data.updatePending === true);
        update.textContent = data.updatePending === true ? 'Update klaar: herstart nodig'
            : data.updatePending === false ? 'Systeem is up-to-date' : 'Updates: onbekend';
    }
</script>
